[project]
name = "bulkhead"
version = "0.1.0"
description = "Secure-by-design AI-agent backend: FastAPI + PydanticAI + Postgres RLS + MCP + Langfuse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[openai,anthropic]>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "mcp>=2.0",
    "openai>=1.50",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.13.0",
    # Tracing (ADR-0008, Spec 8 / #62): a regular dependency, not an optional extra, so the
    # shipped deployment image can trace without an extra install step. `logfire` is listed for
    # its OTel SDK/OTLP exporter dependencies and as the documented tracing library name; the
    # application builds its own TracerProvider(s)/exporter(s) explicitly (app/observability.py)
    # rather than calling `logfire.configure()`, which only supports one global provider and
    # can't give two tenants in different residencies two distinct trace sinks in one process.
    "logfire>=3",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Real RLS test against embedded Postgres+pgvector: uv sync --group dbtest
dbtest = ["pgserver>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Settings reads /run/secrets (ADR-0011); it does not exist outside a container.
filterwarnings = ['ignore:directory "/run/secrets" does not exist']

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
