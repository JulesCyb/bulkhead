[project]
name = "ai-app"
version = "0.1.0"
description = "Starter: AI-agent backend as an API - FastAPI + PydanticAI + Postgres/pgvector (RLS) + MCP + Langfuse"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pydantic-ai-slim[openai,anthropic]>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "mcp>=2.0",
    "openai>=1.50",
    "httpx>=0.27",
]

[project.optional-dependencies]
observability = ["logfire>=3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# Real RLS test against embedded Postgres+pgvector: uv sync --group dbtest
dbtest = ["pgserver>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
