<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1080" width="1400" height="1080" role="img" aria-label="bulkhead: a multi-tenant AI-agent backend. Three walls the agents cannot cross: each customer's data is sealed by Postgres Row-Level Security; every change needs a human's approval; content never leaves its data residency.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#121C2F"/></linearGradient><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#3A4D6B"/></marker></defs>
<rect width="1400" height="1080" rx="28" fill="url(#bg)"/>
<text x="700" y="74" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#F3F6FB" letter-spacing="-1">bulkhead<tspan font-weight="400" fill="#FF5C5C" letter-spacing="0" dx="18">secure by design</tspan></text>
<text x="700" y="110" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#7C8DA8" letter-spacing="0">One backend. Many customers. Any number of agents. Three walls that hold even when an agent is tricked, the code has a bug, or the config is wrong.</text>
<rect x="215.0" y="158" width="230" height="44" rx="22.0" fill="#152239" stroke="#2C3F60" stroke-width="1.2"/>
<text x="330.0" y="185.76" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#C4CFE0" letter-spacing="0">Your web app</text>
<line x1="330" y1="202" x2="330" y2="246" stroke="#3A4D6B" stroke-width="1.5"/>
<rect x="585.0" y="158" width="230" height="44" rx="22.0" fill="#152239" stroke="#2C3F60" stroke-width="1.2"/>
<text x="700.0" y="185.76" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#C4CFE0" letter-spacing="0">Your mobile app</text>
<line x1="700" y1="202" x2="700" y2="246" stroke="#3A4D6B" stroke-width="1.5"/>
<rect x="910.0" y="158" width="320" height="44" rx="22.0" fill="#152239" stroke="#2C3F60" stroke-width="1.2"/>
<text x="1070.0" y="185.76" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#C4CFE0" letter-spacing="0">Claude Code / any MCP client</text>
<line x1="1070" y1="202" x2="1070" y2="246" stroke="#3A4D6B" stroke-width="1.5"/>
<rect x="200" y="248" width="1000" height="48" rx="24" fill="#152239" stroke="#2C3F60" stroke-width="1.2"/>
<text x="700" y="278" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#C4CFE0" letter-spacing="0">The front door: every request says which customer it belongs to and carries a signed token</text>
<text x="700" y="322" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">/v1/t/{tenant_id}/…  ·  bearer token verified on every request  ·  path, token audience and membership must agree</text>
<line x1="700" y1="332" x2="700" y2="352" stroke="#3A4D6B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="120" y="356" width="1160" height="470" rx="28" fill="#111B2E" stroke="#25364F" stroke-width="1.5" filter="url(#soft)"/>
<text x="160" y="386" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7C8DA8" letter-spacing="1.6">ONE DEPLOYMENT · SHARED BY ALL CUSTOMERS</text>
<rect x="160" y="404" width="330" height="122" rx="14" fill="#1A2A45" stroke="#2F4263" stroke-width="1.2"/>
<text x="325" y="438" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#F3F6FB" letter-spacing="0">Your AI agents</text>
<text x="325" y="462" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4CFE0" letter-spacing="0">read, answer, propose changes</text>
<text x="325" y="484" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4CFE0" letter-spacing="0">never hold a database password</text>
<text x="325" y="512" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">PydanticAI · tools only · run limits</text>
<line x1="490" y1="465" x2="552" y2="465" stroke="#3A4D6B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="560" y="400" width="12" height="130" rx="6.0" fill="#FF5C5C" opacity="0.55" filter="url(#glow)"/>
<rect x="560" y="400" width="12" height="130" rx="6.0" fill="#FF5C5C"/>
<circle cx="566.0" cy="400" r="17" fill="#FF5C5C" stroke="#0B1220" stroke-width="3"/>
<text x="566.0" y="406" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0">2</text>
<text x="604" y="434" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F3F6FB" letter-spacing="0">Wall 2 — a human says yes</text>
<text x="604" y="462" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C4CFE0" letter-spacing="0">Before an agent changes anything, a person approves that exact change.</text>
<text x="604" y="486" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C4CFE0" letter-spacing="0">There is no “always allow”.</text>
<text x="604" y="514" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">pending action stored server-side  ·  standing grants for unattended agents  ·  audited</text>
<text x="200" y="582" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F3F6FB" letter-spacing="0">Wall 1 — sealed compartments</text>
<rect x="200" y="612" width="300" height="104" rx="14" fill="#10282F" stroke="#237A73" stroke-width="1.2"/>
<text x="350" y="656" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#4FD1C5" letter-spacing="0">Customer A</text>
<text x="350" y="684" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4CFE0" letter-spacing="0">only their data</text>
<rect x="544" y="612" width="300" height="104" rx="14" fill="#10282F" stroke="#237A73" stroke-width="1.2"/>
<text x="694" y="656" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#4FD1C5" letter-spacing="0">Customer B</text>
<text x="694" y="684" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4CFE0" letter-spacing="0">only their data</text>
<rect x="888" y="612" width="300" height="104" rx="14" fill="#10282F" stroke="#237A73" stroke-width="1.2"/>
<text x="1038" y="656" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#4FD1C5" letter-spacing="0">Customer C</text>
<text x="1038" y="684" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#C4CFE0" letter-spacing="0">only their data</text>
<rect x="516" y="596" width="12" height="138" rx="6.0" fill="#FF5C5C" opacity="0.55" filter="url(#glow)"/>
<rect x="516" y="596" width="12" height="138" rx="6.0" fill="#FF5C5C"/>
<circle cx="522.0" cy="596" r="17" fill="#FF5C5C" stroke="#0B1220" stroke-width="3"/>
<text x="522.0" y="602" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0">1</text>
<rect x="860" y="596" width="12" height="138" rx="6.0" fill="#FF5C5C" opacity="0.55" filter="url(#glow)"/>
<rect x="860" y="596" width="12" height="138" rx="6.0" fill="#FF5C5C"/>
<text x="200" y="766" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C4CFE0" letter-spacing="0">Each customer's data sits in its own compartment. The database enforces the wall — not the developer, not the agent, not a code review.</text>
<text x="200" y="794" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">Postgres 17  ·  Row-Level Security forced on every table  ·  the app's DB role has no superuser and cannot bypass RLS</text>
<line x1="700" y1="826" x2="700" y2="854" stroke="#3A4D6B" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="300" y="862" width="800" height="12" rx="6.0" fill="#FF5C5C" opacity="0.55" filter="url(#glow)"/>
<rect x="300" y="862" width="800" height="12" rx="6.0" fill="#FF5C5C"/>
<circle cx="300" cy="868.0" r="17" fill="#FF5C5C" stroke="#0B1220" stroke-width="3"/>
<text x="300" y="874.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="0">3</text>
<text x="700" y="912" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F3F6FB" letter-spacing="0">Wall 3 — data stays where it belongs</text>
<text x="700" y="940" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#C4CFE0" letter-spacing="0">An EU customer's text never reaches a US model or a US log. If the config would allow it, the server refuses to start.</text>
<text x="700" y="964" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">residency allow-list per customer  ·  routes model, embeddings and traces  ·  fails closed</text>
<rect x="250" y="998" width="420" height="44" rx="22.0" fill="#152239" stroke="#2C3F60" stroke-width="1.2"/>
<text x="460.0" y="1025.4" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#C4CFE0" letter-spacing="0">The AI model · a budget per customer</text>
<rect x="730" y="998" width="420" height="44" rx="22.0" fill="#152239" stroke="#2C3F60" stroke-width="1.2"/>
<text x="940.0" y="1025.4" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#C4CFE0" letter-spacing="0">Monitoring · no message content by default</text>
<text x="460" y="1064" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">LiteLLM gateway</text>
<text x="940" y="1064" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#7C8DA8" letter-spacing="0">Langfuse via OpenTelemetry · one sink per residency</text>
</svg>