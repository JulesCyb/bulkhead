services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      # Role-level settings for the app role, independent of the per-transaction statement
      # timeout the app sets itself (Spec 7 / #55; see docker/postgres/01-init.sh).
      APP_STATEMENT_TIMEOUT_MS: ${APP_STATEMENT_TIMEOUT_MS:-60000}
      APP_CONNECTION_LIMIT: ${APP_CONNECTION_LIMIT:-50}

      APP_OWNER_DB_PASSWORD: ${APP_OWNER_DB_PASSWORD:-app_owner}
      # The model gateway's own role/database password (Spec 7 / #51; see
      # docker/postgres/01-init.sh) — never the application's own credential.
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway}
    volumes:
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost — a reverse proxy or SSH tunnel is the only way in from outside.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h localhost forces TCP: during first-boot initdb a socket-only temp server runs,
      # which a socket probe would wrongly report as ready.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: runs migrations with the owner role, then exits. Keeps the owner role's DSN
  # out of the long-running api container.
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL_MIGRATIONS: postgresql+asyncpg://app_owner:${APP_OWNER_DB_PASSWORD:-app_owner}@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run --no-sync alembic upgrade head

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD:-app}@postgres:5432/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Required (ADR-0009): every deployment runs its own model gateway, no profile flag. It gets
  # its own database/role (never the app's — see docker/postgres/01-init.sh) and only the
  # variables it actually needs: no APP_DB_PASSWORD/APP_OWNER_DB_PASSWORD, no LANGFUSE_* secret.
  # An unset LITELLM_MASTER_KEY fails the render (`${...:?...}`) instead of shipping a gateway
  # nobody can mint a tenant key against.
  litellm:
    image: ghcr.io/berriai/litellm:v1.80.11-stable.1  # pinned release, not a floating tag
    environment:
      DATABASE_URL: postgresql://gateway:${GATEWAY_DB_PASSWORD:-gateway}@postgres:5432/gateway
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set — mint per-tenant virtual keys against it (docs/deployment.md)}
      # Provider credentials for the aliases configured in docker/litellm/config.yaml.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"

  # Langfuse (v3) needs ClickHouse, Redis, and MinIO: include the official docker-compose.yml from
  # https://github.com/langfuse/langfuse (docs/deployment.md) instead of rebuilding it here.

volumes:
  pgdata:
