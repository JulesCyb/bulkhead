services:
  postgres:
    # pinned release + digest (#18, #80), not the floating pg17 tag and not a tag that a registry
    # could silently repoint
    image: pgvector/pgvector:0.8.6-pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    networks:
      # `db`: the application's own path to postgres (api, migrate). `gatewaydb`: a separate,
      # disjoint network carrying only the gateway's own database traffic (#18) — the gateway
      # never joins `db`, so it has no route to the application's connections to postgres, even
      # though postgres itself bridges both (its own database and the gateway's live on the same
      # cluster instance; see docker/postgres/01-init.sh and ADR-0009).
      - db
      - gatewaydb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
      # Role-level settings for the app role, independent of the per-transaction statement
      # timeout the app sets itself (Spec 7 / #55; see docker/postgres/01-init.sh).
      APP_STATEMENT_TIMEOUT_MS: ${APP_STATEMENT_TIMEOUT_MS:-60000}
      APP_CONNECTION_LIMIT: ${APP_CONNECTION_LIMIT:-50}

      APP_OWNER_DB_PASSWORD: ${APP_OWNER_DB_PASSWORD:-app_owner}
      # The model gateway's own role/database password (Spec 7 / #51; see
      # docker/postgres/01-init.sh) — never the application's own credential.
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-gateway}
    volumes:
      - ./docker/postgres/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to localhost — a reverse proxy or SSH tunnel is the only way in from outside.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # -h localhost forces TCP: during first-boot initdb a socket-only temp server runs,
      # which a socket probe would wrongly report as ready.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # One-shot: runs migrations with the owner role, then exits. Keeps the owner role's DSN
  # out of the long-running api container.
  #
  # No `env_file: .env` (#18): that used to hand this one-shot job every variable in .env,
  # including secrets it has no business reading (LITELLM_MASTER_KEY, the app/gateway role
  # passwords, provider API keys). It gets only its own owner DSN plus the trace-sink/residency
  # wiring it shares with `api` (ADR-0008, tests/test_residency_trace_sink_compose.py).
  migrate:
    build: .
    networks: [db]
    environment:
      DATABASE_URL_MIGRATIONS: postgresql+asyncpg://app_owner:${APP_OWNER_DB_PASSWORD:-app_owner}@postgres:5432/app
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      RESIDENCY: ${RESIDENCY:-eu}
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run --no-sync alembic upgrade head

  # No `env_file: .env` (#18): the api container used to receive the whole file, including the
  # database owner's DSN/password, the gateway's own DB password, and the gateway's master key —
  # none of which its own job needs. Every variable app.config.Settings can read is named
  # explicitly below instead.
  api:
    build: .
    # `db` to reach postgres; `gateway` only to call the gateway's HTTP API
    # (LITELLM_BASE_URL=http://litellm:4000) — never `gatewaydb`, the network carrying the
    # gateway's own database traffic (#18).
    networks: [db, gateway]
    environment:
      APP_NAME: ${APP_NAME:-ai-app}
      ENVIRONMENT: ${ENVIRONMENT}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://app:${APP_DB_PASSWORD:-app}@postgres:5432/app
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-30000}
      # "claude-eu" is a gateway alias (docker/litellm/config.yaml), matching RESIDENCY=eu's
      # default allow-list (config/residency.toml) -- not a raw provider id.
      LLM_MODEL: ${LLM_MODEL:-claude-eu}
      # Required in every environment (ADR-0009, ai-app-starter#7): `app.config.Settings` refuses
      # to construct at all with this unset -- the gateway is never an optional profile, so the
      # default here is the gateway's own compose hostname, not empty.
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      # The per-tenant virtual key minted against the gateway's master key — never the master
      # key itself, which stays out of this container entirely (see the litellm service below).
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      # Provider keys are gateway-only (ADR-0009, ai-app-starter#7): app.config.Settings has no
      # field for either of these -- the api container never receives them at all. They are read
      # only by the litellm service below, from docker/litellm/config.yaml.
      RESIDENCY: ${RESIDENCY:-eu}
      AUTH_MODE: ${AUTH_MODE}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      MCP_TENANT_ID: ${MCP_TENANT_ID:-}
      MCP_IDENTITY_ID: ${MCP_IDENTITY_ID:-}
      REQUEST_LIMIT_MAX: ${REQUEST_LIMIT_MAX:-30}
      REQUEST_LIMIT_WINDOW_SECONDS: ${REQUEST_LIMIT_WINDOW_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    command: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000

  # Required (ADR-0009): every deployment runs its own model gateway, no profile flag. It gets
  # its own database/role (never the app's — see docker/postgres/01-init.sh) and only the
  # variables it actually needs: no APP_DB_PASSWORD/APP_OWNER_DB_PASSWORD, no LANGFUSE_* secret.
  # An unset LITELLM_MASTER_KEY fails the render (`${...:?...}`) instead of shipping a gateway
  # nobody can mint a tenant key against.
  #
  # `gatewaydb` (its own database on postgres) and `gateway` (so `api` can call its HTTP API) —
  # never `db`, the network `api`/`migrate` use for the application's own connections to
  # postgres. A compromised gateway credential therefore has no network route to the
  # application's database traffic, and `migrate` (which never calls the gateway) has no route
  # to the gateway at all. See docker-compose.yml `networks:` and ADR-0009.
  litellm:
    # pinned release + digest (#80), not a floating tag
    image: ghcr.io/berriai/litellm:v1.80.11-stable.1@sha256:47afa3b6f6af446488f51f4bbcefbef4cf5f01da4b22c4f440a918def952842d
    networks: [gatewaydb, gateway]
    environment:
      DATABASE_URL: postgresql://gateway:${GATEWAY_DB_PASSWORD:-gateway}@postgres:5432/gateway
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set — mint per-tenant virtual keys against it (docs/deployment.md)}
      # Provider credentials for the aliases configured in docker/litellm/config.yaml.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./docker/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"

  # Langfuse (v3) needs ClickHouse, Redis, and MinIO: include the official docker-compose.yml from
  # https://github.com/langfuse/langfuse (docs/deployment.md) instead of rebuilding it here.

networks:
  # The application's own path to postgres (api, migrate). The gateway is never a member (#18):
  # it has no route to the application's own database traffic.
  db:
  # The gateway's own, disjoint path to its own database on the same postgres instance (#18) —
  # see the comments on the postgres and litellm services above. Neither `api` nor `migrate` is
  # a member: this network exists solely for litellm <-> postgres.
  gatewaydb:
  # `api` calling the gateway's OpenAI-compatible HTTP API (LITELLM_BASE_URL). Postgres is never
  # a member — this is application/gateway traffic only, not database traffic.
  gateway:

volumes:
  pgdata:
